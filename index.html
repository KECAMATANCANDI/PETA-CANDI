L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let layer=L.geoJSON(data,{style:{color:'#0066cc',weight:2,fillOpacity:.18},onEachFeature:(f,l)=>{const p=f.properties; l.bindPopup(`<b>${p.nama}</b><br>Kode Desa: ${p.kode_kd}<br>Kecamatan: ${p.kecamatan}<br>Kabupaten: ${p.kab_kota}`);}}).addTo(map);
map.fitBounds(layer.getBounds(),{padding:[30,30]});
const desa=document.getElementById('desa');
function selectDesa(name){if(!name){layer.setStyle({color:'#0066cc',weight:2,fillOpacity:.18}); map.fitBounds(layer.getBounds(),{padding:[30,30]}); return;} const found=data.features.find(f=>f.properties.kel_desa.toLowerCase()===name.toLowerCase()); if(!found)return; layer.setStyle({color:'#0066cc',weight:2,fillOpacity:.08}); const one=L.geoJSON(found,{style:{color:'#e11d48',weight:4,fillOpacity:.35}}).addTo(map); map.fitBounds(one.getBounds(),{padding:[50,50]}); one.bindPopup(`<b>${found.properties.nama}</b><br>Kode Desa: ${found.properties.kode_kd}<br>Kecamatan: ${found.properties.kecamatan}<br>Kabupaten: ${found.properties.kab_kota}`).openPopup(); setTimeout(()=>map.removeLayer(one),30000); }
const params=new URLSearchParams(location.search); const q=params.get('desa'); if(q){desa.value=[...desa.options].find(o=>o.value.toLowerCase()===q.toLowerCase())?.value||''; selectDesa(q);}
desa.addEventListener('change',()=>{const v=desa.value; const u=new URL(location.href); if(v)u.searchParams.set('desa',v);else u.searchParams.delete('desa'); history.replaceState(null,'',u); selectDesa(v);});
